# cv-harness - Docker Compose (producción/server)
#
# SOLO lo necesario para correr el proyecto. NO crea base de datos ni redis:
# en el server ya corren (misma red microservices-network que atiende):
#   - Redis compartida  → hostname "redis:6379"
#   - PostgreSQL        → hostname configurable (default "cvharness-postgres";
#                         en el server de atiende suele ser "atiende-postgres")
#                          con un database "cvharness" + extensión pgvector.
#
# Uso en el server:
#   docker compose up -d          # levanta api + scraper
#   docker compose logs -f
#   docker compose down
#
# En dev local (necesita postgres+redis): 
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml \
#     --profile fixture up -d     # + fixture E2E

services:
  # ─────────────────────────────────────────
  # API / harness (NestJS)
  # ─────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      target: development
    container_name: cvharness-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3100}
      # Postgres EXTERNO (ya corriendo). Configura DATABASE_HOST según tu server.
      DATABASE_URL: postgresql://${POSTGRES_USER:-cvharness}:${POSTGRES_PASSWORD:-cvharness}@${DATABASE_HOST:-cvharness-postgres}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-cvharness}?schema=public
      # Redis compartida (ya corriendo como "redis" en la red).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-cvharness}
      # La fuente E2E solo se siembra con FIXTURE_ENABLED=true (dev local).
      FIXTURE_BASE_URL: ${FIXTURE_BASE_URL:-http://cvharness-fixture}
      FIXTURE_ENABLED: ${FIXTURE_ENABLED:-false}
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
    ports:
      - "${API_PORT:-3100}:3100"
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Worker de scraping (Rust) — consume scraper:requests
  # ─────────────────────────────────────────
  scraper:
    build:
      context: ./apps/scraper
    container_name: cvharness-scraper
    restart: unless-stopped
    environment:
      REDIS_URL: ${SCRAPER_REDIS_URL:-redis://redis:6379}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Fixture E2E (SOLO dev, profile "fixture"): página HTML con vacantes fake.
  # No se levanta con `docker compose up -d`.
  # ─────────────────────────────────────────
  jobs-fixture:
    image: nginx:alpine
    container_name: cvharness-fixture
    profiles: ["fixture"]
    volumes:
      - ./fixtures/www:/usr/share/nginx/html:ro
    ports:
      - "${FIXTURE_PORT:-8090}:80"
    networks:
      - microservices-network

networks:
  microservices-network:
    external: true
